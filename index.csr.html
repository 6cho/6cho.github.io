    <!-- Apply the saved theme before first paint, so dark mode never flashes light. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('theme-dark');
        }
      } catch (e) {}
      // Layout before first paint: desktop (>1000px), tablet (<=1000px, also
      // set for phones) and phone (<=700px). AppComponent keeps it in sync.
      (function () {
        var w = window.innerWidth, c = document.documentElement.classList;
        c.add(w > 1000 ? 'bp-desk' : 'bp-tab');
        if (w <= 700) c.add('bp-phone');
      })();
    </script>
