<landing [data]="titleData"> </landing>

@for (group of groups; track group.title) {
<section class="project-group">
  <header class="project-group__header">
    <h3 class="project-group__title">{{ group.title }}</h3>
    <p class="project-group__subtitle">{{ group.subtitle }}</p>
  </header>

  @for (project of group.projects; track project.title) {
  <project-section [project]="project"></project-section>
  }
</section>
}
