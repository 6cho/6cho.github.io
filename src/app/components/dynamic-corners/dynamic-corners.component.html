<!-- Four corner pieces: dots at rest, brackets in content, diagonal lines during page changes. -->
<div class="corners" [class.corners--open]="scrolled" aria-hidden="true">
  <i class="corner corner--tl"><span class="corner__line"></span></i>
  <i class="corner corner--tr"><span class="corner__line"></span></i>
  <i class="corner corner--br"><span class="corner__line"></span></i>
  <i class="corner corner--bl"><span class="corner__line"></span></i>
</div>
