@if (activeImage) {
<div class="image-gallery">
  <div class="image-gallery__backdrop">
    <img [src]="activeImage.src" alt="" aria-hidden="true" />
  </div>
  <img
    class="image-gallery__active"
    [src]="activeImage.src"
    [alt]="activeImage.alt"
  />

  @if (images.length > 1) {
  <button
    class="image-gallery__arrow image-gallery__arrow--left"
    (click)="prev()"
    aria-label="Previous image"
  >
    <i class="fa-solid fa-chevron-left"></i>
  </button>
  <button
    class="image-gallery__arrow image-gallery__arrow--right"
    (click)="next()"
    aria-label="Next image"
  >
    <i class="fa-solid fa-chevron-right"></i>
  </button>

  <div class="image-gallery__dots">
    @for (image of images; track $index) {
    <button
      class="image-gallery__dot"
      [class.active]="$index === activeIndex"
      (click)="go($index)"
      [attr.aria-label]="'Show image ' + ($index + 1)"
    ></button>
    }
  </div>
  }
</div>
}
