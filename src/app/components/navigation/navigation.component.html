<div class="navigation" [class.navigation--menu-open]="menuOpen">
  <!-- Phones: menu button that opens the page keys above the dock. -->
  <button
    class="navigation__menu"
    type="button"
    aria-label="Menu"
    [attr.aria-expanded]="menuOpen"
    (click)="toggleMenu($event)"
  >
    <i class="fa-solid" [class.fa-bars]="!menuOpen" [class.fa-xmark]="menuOpen" aria-hidden="true"></i>
  </button>

  <!-- The name stays on the rail once the screen's dot display scrolls away. -->
  <div class="navigation__header">
    <div class="navigation__item-header">
      <h1>ERIC CHO</h1>
    </div>
  </div>

  <div class="navigation__list">
    @for (route of routes; track route) {

    <button
      class="navigation__item {{ getIconActiveClass(route.page) }}"
      (click)="navigateURL(route.path)"
    >
      <i class="icon circle {{ getIconActiveClass(route.page) }}"></i>
      {{ route.display }}
    </button>
    }
  </div>

  <div class="navigation__links">
    @for (link of links; track link.href) {
    <a
      class="navigation__link"
      [href]="link.href"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="link.label"
      [title]="link.label"
    >
      <i class="{{ link.icon }}" aria-hidden="true"></i>
    </a>
    }

    <!-- Light / dark switch: a recessed track with a sliding key. -->
    <button
      class="navigation__theme"
      [class.navigation__theme--dark]="dark"
      type="button"
      role="switch"
      [attr.aria-checked]="dark"
      aria-label="Dark mode"
      (click)="toggleTheme($event)"
    >
      <span class="navigation__theme-knob">
        <i class="fa-solid" [class.fa-sun]="!dark" [class.fa-moon]="dark" aria-hidden="true"></i>
      </span>
    </button>
  </div>

  <!-- Second screen: a minimap of the current page. -->
  <minimap class="navigation__minimap"></minimap>

  <div class="navigation__footer">
    <button class="navigation__item-resume mobile" (click)="getResume()" aria-label="Download resume">
      <span class="navigation__resume-label">Resume</span>
      <i class="icon fa-solid fa-chevron-down" aria-hidden="true"></i>
    </button>
  </div>
</div>
